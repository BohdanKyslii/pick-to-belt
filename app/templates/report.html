<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick-to-Belt | Звіт</title>
<style>
:root { --primary:#2563eb; --success:#16a34a; --radius:12px; --shadow:0 2px 8px rgba(0,0,0,.12); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,sans-serif; background:#f0f4f8; min-height:100vh; }
.header { background:var(--primary);color:#fff;padding:12px 16px;
          display:flex;align-items:center;justify-content:space-between;
          position:sticky;top:0;z-index:100;box-shadow:var(--shadow); }
.header h1 { font-size:18px;font-weight:700; }
.header-links a { color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;margin-left:12px; }
.container { padding:16px; }
.period-bar { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
              padding:12px 16px;margin-bottom:16px;display:flex;gap:8px;align-items:center; }
.period-bar label { font-size:13px;color:#6b7280; }
.period-bar select { padding:6px 10px;border-radius:8px;border:1.5px solid #d1d5db;font-size:14px; }
.btn { padding:8px 14px;border-radius:8px;border:none;cursor:pointer;
       font-size:14px;font-weight:600; }
.btn-primary { background:var(--primary);color:#fff; }
.kpi-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px; }
.kpi-card { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
            padding:16px;text-align:center; }
.kpi-val  { font-size:32px;font-weight:800;color:var(--primary); }
.kpi-label { font-size:13px;color:#6b7280;margin-top:4px; }
.card { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px; }
.card-title { font-size:15px;font-weight:700;margin-bottom:12px; }
.top-row { display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6; }
.top-row:last-child { border-bottom:none; }
.top-rank { width:28px;height:28px;border-radius:50%;background:#e5e7eb;
            display:flex;align-items:center;justify-content:center;
            font-size:12px;font-weight:700;margin-right:10px;flex-shrink:0; }
.top-art { font-size:13px;color:#6b7280; }
.top-name { font-size:14px;font-weight:600; }
.top-count { margin-left:auto;font-size:16px;font-weight:700;color:var(--primary); }
</style>
</head>
<body>
<div class="header">
  <h1>📊 Звіт</h1>
  <div class="header-links">
    <a href="/">📦 Оператор</a>
    <a href="/admin">⚙️ Налаштування</a>
  </div>
</div>
<div class="container">
  <div class="period-bar">
    <label>Період:</label>
    <select id="periodSel" onchange="loadReport()">
      <option value="1">Сьогодні</option>
      <option value="7" selected>7 днів</option>
      <option value="30">30 днів</option>
      <option value="90">90 днів</option>
    </select>
    <button class="btn btn-primary" onclick="loadReport()">🔄 Оновити</button>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-val" id="kpiOrders">—</div><div class="kpi-label">Замовлень</div></div>
    <div class="kpi-card"><div class="kpi-val" id="kpiItems">—</div><div class="kpi-label">Позицій</div></div>
    <div class="kpi-card"><div class="kpi-val" id="kpiPicked">—</div><div class="kpi-label">Відібрано шт</div></div>
    <div class="kpi-card"><div class="kpi-val" id="kpiManual">—</div><div class="kpi-label">Вручну</div></div>
  </div>
  <div class="card">
    <div class="card-title">🏆 Топ товарів</div>
    <div id="topProducts"></div>
  </div>
</div>
<script>
async function loadReport() {
  const days = document.getElementById('periodSel').value;
  const r = await fetch(`/api/report?days=${days}`);
  const data = await r.json();
  document.getElementById('kpiOrders').textContent = data.total_orders;
  document.getElementById('kpiItems').textContent = data.total_items;
  document.getElementById('kpiPicked').textContent = data.total_picked;
  document.getElementById('kpiManual').textContent = data.manual_items;
  const top = document.getElementById('topProducts');
  if (!data.top_products.length) {
    top.innerHTML = '<div style="color:#6b7280;text-align:center;padding:20px">Немає даних</div>';
    return;
  }
  top.innerHTML = data.top_products.map((p, i) => `
    <div class="top-row">
      <div class="top-rank">${i+1}</div>
      <div>
        <div class="top-name">${p.name}</div>
        <div class="top-art">Арт: ${p.articl}</div>
      </div>
      <div class="top-count">${p.count} шт</div>
    </div>
  `).join('');
}
loadReport();
</script>
</body>
</html>
