<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick-to-Belt | Налаштування</title>
<style>
:root { --primary:#2563eb; --success:#16a34a; --danger:#dc2626;
        --warning:#d97706; --gray:#6b7280; --radius:12px;
        --shadow:0 2px 8px rgba(0,0,0,.12); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:#f0f4f8; min-height:100vh; }
.header { background:var(--primary);color:#fff;padding:12px 16px;
          display:flex;align-items:center;justify-content:space-between;
          position:sticky;top:0;z-index:100;box-shadow:var(--shadow); }
.header h1 { font-size:18px;font-weight:700; }
.header-links a { color:rgba(255,255,255,.85);text-decoration:none;
                  font-size:13px;margin-left:12px; }
.container { padding:16px; }
.btn { padding:8px 16px;border-radius:8px;border:none;cursor:pointer;
       font-size:14px;font-weight:600;transition:.15s; }
.btn-primary { background:var(--primary);color:#fff; }
.btn-primary:hover { background:#1d4ed8; }
.btn-success { background:var(--success);color:#fff; }
.btn-success:hover { background:#15803d; }
.btn-danger  { background:var(--danger);color:#fff; }
.btn-danger:hover  { background:#b91c1c; }
.btn-outline { background:#fff;color:var(--primary);border:1.5px solid var(--primary); }
.btn-outline:hover { background:#eff6ff; }
.btn-ghost   { background:transparent;color:var(--gray);border:none;padding:4px 8px;font-size:13px;cursor:pointer; }
.btn-sm { padding:5px 10px;font-size:12px; }
.hidden { display:none !important; }

.actions-bar { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
               background:#fff;padding:12px;border-radius:var(--radius);
               box-shadow:var(--shadow); }
.section-title { font-size:15px;font-weight:700;margin-bottom:10px;color:#1f2937; }

/* Cells grid */
.grid-16 { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px; }
.cell-card { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
             padding:12px;border:2px solid transparent;transition:.2s;cursor:pointer;
             overflow:hidden; }
.cell-card:hover { border-color:var(--primary); }
.cell-card.empty { border-style:dashed;border-color:#d1d5db; }
.cell-num  { font-size:11px;color:var(--gray);margin-bottom:3px; }
.cell-art  { font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.cell-name { font-size:11px;color:var(--gray);margin-top:1px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.cell-stock { display:flex;justify-content:space-between;align-items:center;margin-top:7px; }
.stock-bar  { flex:1;height:5px;background:#e5e7eb;border-radius:3px;margin-right:8px;overflow:hidden; }
.stock-fill { height:100%;border-radius:3px;background:var(--success);transition:.3s; }
.stock-fill.low   { background:#f59e0b; }
.stock-fill.empty { background:var(--danger); }
.stock-text { font-size:11px;font-weight:700; }
.stock-text.low   { color:#d97706; }
.stock-text.empty { color:var(--danger); }
.cell-thumb { width:100%;height:60px;object-fit:cover;border-radius:6px;
              margin-top:6px;display:block; }

/* Catalog products list */
.catalog-list { display:flex;flex-direction:column;gap:8px; }
.catalog-card { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
                padding:12px 16px;display:flex;align-items:center;gap:12px; }
.catalog-thumb { width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;
                 background:#e5e7eb;display:flex;align-items:center;justify-content:center;
                 font-size:20px; }
.catalog-thumb img { width:100%;height:100%;border-radius:8px;object-fit:cover; }
.catalog-info { flex:1;min-width:0; }
.catalog-art  { font-size:13px;font-weight:700; }
.catalog-name { font-size:12px;color:var(--gray);margin-top:1px; }
.catalog-dims { font-size:11px;color:#9ca3af;margin-top:2px; }
.catalog-cell-badge { font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600; }
.badge-in-cell { background:#d1fae5;color:#065f46; }
.badge-no-cell { background:#f3f4f6;color:#6b7280; }
.catalog-actions { display:flex;gap:6px;flex-shrink:0; }

/* Tab */
.tab-bar { display:flex;gap:4px;margin-bottom:16px; }
.tab { padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;
       background:#e5e7eb;color:#374151;font-weight:500;border:none; }
.tab.active { background:var(--primary);color:#fff; }
.tab-content { display:none; }
.tab-content.active { display:block; }

/* Boxes */
.box-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px; }
.box-card { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px; }
.box-card-header { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px; }
.box-card-name  { font-weight:700;font-size:15px; }
.box-card-actions { display:flex;gap:4px; }
.box-dims-grid { display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px; }
.box-dim-label { color:var(--gray);font-size:11px; }
.box-dim-val   { font-weight:600; }

/* Modal */
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.5);
                 z-index:200;display:flex;align-items:center;justify-content:center;
                 padding:16px;overflow-y:auto; }
.modal-overlay.hidden { display:none; }
.modal { background:#fff;border-radius:var(--radius);padding:20px;
         width:100%;max-width:500px;max-height:92vh;overflow-y:auto; }
.modal-wide { max-width:680px; }
.modal h3 { font-size:17px;font-weight:700;margin-bottom:14px; }
.form-group { margin-bottom:10px; }
.form-group label { display:block;font-size:12px;color:var(--gray);margin-bottom:3px;font-weight:600; }
.form-group input,.form-group textarea,.form-group select {
  width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #d1d5db;
  font-size:14px;outline:none;font-family:inherit; }
.form-group input:focus,.form-group textarea:focus { border-color:var(--primary); }
.form-row   { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
.form-row-3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px; }
.modal-actions { display:flex;gap:8px;margin-top:14px;flex-wrap:wrap; }
.modal-divider { border:none;border-top:1px solid #e5e7eb;margin:12px 0; }

/* Photo preview */
.photo-area { position:relative;display:inline-block;margin-bottom:8px; }
.photo-preview { width:100px;height:100px;border-radius:8px;object-fit:cover;display:block; }
.photo-placeholder { width:100px;height:100px;border-radius:8px;background:#e5e7eb;
                     display:flex;align-items:center;justify-content:center;font-size:36px; }
.photo-del-btn { position:absolute;top:-6px;right:-6px;background:var(--danger);
                 color:#fff;border:none;border-radius:50%;width:22px;height:22px;
                 cursor:pointer;font-size:12px;line-height:22px;text-align:center; }
.photo-upload-input { font-size:12px;color:var(--gray);margin-top:4px;display:block; }
/* Стікерний textarea — розмір як справжній ярлик */
.sticker-label-input { width:50mm !important;height:20mm !important;
                       font-size:4pt !important;font-family:monospace;
                       resize:none;padding:2px 4px;line-height:1.4;
                       border:1.5px dashed #d1d5db;border-radius:4px;
                       overflow:hidden;background:#fffef0; }
.sticker-label-input:focus { border-color:var(--primary);outline:none; }
/* Readonly volume field */
.vol-field { background:#f3f4f6 !important;color:var(--gray);cursor:default; }

/* Articl lookup */
.articl-row { display:flex;gap:6px; }
.articl-row input { flex:1; }
.articl-status { font-size:11px;margin-top:3px; }
.articl-found { color:var(--success); }
.articl-new   { color:var(--warning); }

/* Search bar */
.search-bar { background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
              padding:10px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center; }
.search-bar input { flex:1;padding:7px 10px;border-radius:8px;border:1.5px solid #d1d5db;
                    font-size:14px;outline:none; }
.search-bar input:focus { border-color:var(--primary); }
</style>
</head>
<body>
<div class="header">
  <h1>⚙️ Налаштування</h1>
  <div class="header-links">
    <a href="/">📦 Оператор</a>
    <a href="/report">📊 Звіт</a>
  </div>
</div>
<div class="container">
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('cells', event)">🔧 Комірки</button>
    <button class="tab" onclick="showTab('catalog', event)">📋 Товари</button>
    <button class="tab" onclick="showTab('boxes', event)">📦 Коробки</button>
  </div>

  <!-- Cells tab (колишній "Товари 16 слотів") -->
  <div id="tab-cells" class="tab-content active">
    <div class="actions-bar">
      <button class="btn btn-outline" onclick="initProducts()">🚀 Ініціалізувати 16 товарів</button>
      <button class="btn btn-outline" onclick="initBoxes()">📦 Додати стандартні коробки</button>
    </div>
    <div class="section-title">Комірки серводвигунів (Плата 0x40)</div>
    <div class="grid-16" id="cellsGrid"></div>
  </div>

  <!-- Catalog tab — всі товари -->
  <div id="tab-catalog" class="tab-content">
    <div class="actions-bar">
      <button class="btn btn-primary" onclick="openCatalogModal(null)">+ Новий товар</button>
    </div>
    <div class="search-bar">
      <input type="text" id="catalogSearch" placeholder="Пошук за артикулом або назвою..."
        oninput="renderCatalog()">
    </div>
    <div class="catalog-list" id="catalogList"></div>
  </div>

  <!-- Boxes tab -->
  <div id="tab-boxes" class="tab-content">
    <div class="actions-bar">
      <button class="btn btn-primary" onclick="openBoxModal(null)">+ Нова коробка</button>
    </div>
    <div class="box-grid" id="boxGrid"></div>
  </div>
</div>

<!-- Product Modal (комірки) -->
<div id="productModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modalTitle">Комірка</h3>
    <input type="hidden" id="editId">
    <input type="hidden" id="editChannel">

    <div class="form-group">
      <label>Артикул *</label>
      <div class="articl-row">
        <input id="fArticl" placeholder="Введіть артикул" onblur="lookupArticl()">
        <button class="btn btn-outline btn-sm" onclick="lookupArticl()">🔍 Знайти</button>
      </div>
      <div id="artStatus" class="articl-status"></div>
    </div>
    <div class="form-group">
      <label>Назва товару</label>
      <input id="fName" placeholder="наприклад: Кабель USB-C 1м">
    </div>
    <hr class="modal-divider">
    <div class="form-row">
      <div class="form-group">
        <label>Місткість комірки (шт)</label>
        <input id="fCapacity" type="number" value="20" min="1">
      </div>
      <div class="form-group">
        <label>Залишок зараз (шт)</label>
        <input id="fStock" type="number" value="0" min="0">
      </div>
    </div>
    <div class="form-group">
      <label>Коментар для оператора</label>
      <textarea id="fComment" rows="2" placeholder="Додаткові інструкції..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="saveProduct()">💾 Зберегти</button>
      <button id="clearCellBtn" class="btn btn-danger hidden" onclick="clearCell()">🗑️ Очистити комірку</button>
      <button class="btn btn-outline" onclick="closeModal()">Скасувати</button>
    </div>
  </div>
</div>

<!-- Catalog Product Modal -->
<div id="catalogModal" class="modal-overlay hidden">
  <div class="modal modal-wide">
    <h3 id="catalogModalTitle">Новий товар</h3>
    <input type="hidden" id="cEditId">

    <!-- Фото -->
    <div class="form-group">
      <label>Фото товару</label>
      <div class="photo-area" id="cPhotoArea">
        <img id="cPhotoPreview" class="photo-preview" style="display:none" src="" alt="">
        <div class="photo-placeholder" id="cPhotoPlaceholder">📦</div>
        <button type="button" class="photo-del-btn" id="cPhotoDelBtn" style="display:none" onclick="deleteCatalogPhoto()">✕</button>
      </div>
      <input type="file" id="cPhotoFile" accept="image/*" class="photo-upload-input" onchange="previewCatalogPhoto(this)">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Артикул *</label>
        <input id="cArticl" placeholder="Введіть артикул">
      </div>
      <div class="form-group">
        <label>Назва товару</label>
        <input id="cName" placeholder="наприклад: Кабель USB-C 1м">
      </div>
    </div>
    <hr class="modal-divider">
    <div class="section-title" style="font-size:13px;margin-bottom:6px">Розміри (см)</div>
    <div class="form-row-3">
      <div class="form-group"><label>Довжина</label><input id="cLength" type="number" step="0.1" value="0" oninput="calcVolume()"></div>
      <div class="form-group"><label>Ширина</label> <input id="cWidth"  type="number" step="0.1" value="0" oninput="calcVolume()"></div>
      <div class="form-group"><label>Висота</label>  <input id="cHeight" type="number" step="0.1" value="0" oninput="calcVolume()"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Вага (г)</label>
        <input id="cWeight" type="number" step="1" value="0">
      </div>
      <div class="form-group">
        <label>Об'єм (см³) <span style="font-size:10px;color:#9ca3af">розраховується автоматично</span></label>
        <input id="cVolume" type="text" class="vol-field" readonly value="0">
      </div>
    </div>
    <hr class="modal-divider">
    <div class="form-row">
      <div class="form-group">
        <label>К-сть стікерів</label>
        <input id="cStickerCount" type="number" value="0" min="0">
      </div>
      <div class="form-group">
        <label>Опис стікера <span style="font-size:10px;color:#9ca3af">50×20 мм · шрифт 4пт</span></label>
        <textarea id="cStickerNote" class="sticker-label-input" placeholder="Текст стрічки..."></textarea>
      </div>
    </div>
    <div class="form-group">
      <label>Коментар для оператора</label>
      <textarea id="cComment" rows="2" placeholder="Додаткові інструкції..."></textarea>
    </div>
    <div class="form-group" id="cAssignCellGroup">
      <label>Призначити до комірки (канал 0–15, залиште порожнім для «без комірки»)</label>
      <input id="cChannel" type="number" min="0" max="15" placeholder="напр. 3">
    </div>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="saveCatalogProduct()">💾 Зберегти</button>
      <button id="catalogDeleteBtn" class="btn btn-danger hidden" onclick="deleteCatalogProduct()">🗑️ Видалити</button>
      <button class="btn btn-outline" onclick="closeCatalogModal()">Скасувати</button>
    </div>
  </div>
</div>

<!-- Box Modal -->
<div id="boxModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="boxModalTitle">Нова коробка</h3>
    <input type="hidden" id="bEditId">
    <div class="form-group">
      <label>Назва (напр. A - 30×20×15)</label>
      <input id="bName" placeholder="A - 30×20×15">
    </div>
    <div class="section-title" style="font-size:13px;margin-bottom:6px">Розміри (см)</div>
    <div class="form-row-3">
      <div class="form-group"><label>Довжина</label><input id="bLength" type="number" step="0.1"></div>
      <div class="form-group"><label>Ширина</label> <input id="bWidth"  type="number" step="0.1"></div>
      <div class="form-group"><label>Висота</label>  <input id="bHeight" type="number" step="0.1"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Макс. заповненість (%)</label>
        <input id="bFillPct" type="number" min="10" max="100" value="80">
      </div>
      <div class="form-group">
        <label>Вага коробки (г)</label>
        <input id="bWeight" type="number" step="1" value="0">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-success" onclick="saveBox()">💾 Зберегти</button>
      <button class="btn btn-outline" onclick="closeModal()">Скасувати</button>
    </div>
  </div>
</div>

<script>
let products = [];
let boxes = [];
let allProducts = [];
let currentProductId = null;
let currentCatalogProductId = null;

async function init() {
  await loadProducts();
  await loadAllProducts();
  await loadBoxes();
}

// ─── Комірки (16 слотів) ─────────────────────────────────────────────────────

async function loadProducts() {
  const r = await fetch('/api/products');
  products = await r.json();
  renderCells();
}

function renderCells() {
  const grid = document.getElementById('cellsGrid');
  const cells = [];
  for (let ch = 0; ch < 16; ch++) {
    const p = products.find(x => x.servo_channel === ch && x.servo_board === '0x40');
    cells.push(renderCell(ch, p));
  }
  grid.innerHTML = cells.join('');
}

function renderCell(ch, product) {
  if (!product) {
    return `<div class="cell-card empty" onclick="openProductModal(null, ${ch})">
      <div class="cell-num">Канал ${ch}</div>
      <div class="cell-art" style="color:#9ca3af">+ Додати товар</div>
    </div>`;
  }

  const pct = product.cell_capacity > 0
    ? Math.round((product.cell_stock / product.cell_capacity) * 100) : 0;
  const cls = pct === 0 ? 'empty' : pct <= 25 ? 'low' : '';
  const thumbHtml = product.photo
    ? `<img src="${product.photo}" class="cell-thumb" onerror="this.style.display='none'">`
    : '';

  return `<div class="cell-card" onclick="openProductModal(${JSON.stringify(product).replace(/"/g,'&quot;')}, ${ch})">
    <div class="cell-num">Канал ${ch}</div>
    <div class="cell-art">${product.articl}</div>
    <div class="cell-name">${product.name || '—'}</div>
    <div class="cell-stock">
      <div class="stock-bar"><div class="stock-fill ${cls}" style="width:${pct}%"></div></div>
      <span class="stock-text ${cls}">${product.cell_stock}/${product.cell_capacity}</span>
    </div>
    ${product.sticker_count > 0 ? '<div style="font-size:10px;color:#f59e0b;margin-top:3px">🏷️ Стікер</div>' : ''}
    ${thumbHtml}
  </div>`;
}

function openProductModal(product, channel) {
  currentProductId = product ? product.id : null;

  document.getElementById('modalTitle').textContent =
    product ? `Канал ${channel} — ${product.articl}` : `Новий товар — Канал ${channel}`;
  document.getElementById('editId').value = product ? product.id : '';
  document.getElementById('editChannel').value = channel;

  document.getElementById('fArticl').value = product ? product.articl : '';
  document.getElementById('fName').value = product ? product.name : '';
  document.getElementById('fCapacity').value = product ? product.cell_capacity : 20;
  document.getElementById('fStock').value = product ? product.cell_stock : 0;
  document.getElementById('fComment').value = product ? product.comment : '';
  document.getElementById('artStatus').textContent = '';

  document.getElementById('clearCellBtn').classList.toggle('hidden', !product);
  document.getElementById('productModal').classList.remove('hidden');
}

async function lookupArticl() {
  const val = document.getElementById('fArticl').value.trim();
  const status = document.getElementById('artStatus');
  if (!val) { status.textContent = ''; return; }

  const existingId = document.getElementById('editId').value;
  const r = await fetch(`/api/products/by_articl?q=${encodeURIComponent(val)}`);
  if (r.ok) {
    const p = await r.json();
    if (existingId && String(p.id) !== existingId) {
      status.innerHTML = `<span style="color:var(--danger)">⚠️ Артикул вже зайнятий іншою коміркою (канал ${p.servo_channel})</span>`;
      return;
    }
    if (!existingId) {
      document.getElementById('fName').value = p.name || '';
      document.getElementById('fCapacity').value = p.cell_capacity;
      document.getElementById('fStock').value = p.cell_stock;
      document.getElementById('fComment').value = p.comment;
    }
    status.innerHTML = `<span class="articl-found">✅ Знайдено в базі</span>`;
  } else {
    status.innerHTML = `<span class="articl-new">✨ Новий артикул — заповніть дані</span>`;
  }
}


async function saveProduct() {
  const id = document.getElementById('editId').value;
  const channel = parseInt(document.getElementById('editChannel').value);
  const articl = document.getElementById('fArticl').value.trim();
  if (!articl) { alert('Введіть артикул'); return; }

  const data = {
    articl,
    name: document.getElementById('fName').value.trim(),
    servo_board: 0x40,
    servo_channel: channel,
    cell_capacity: parseInt(document.getElementById('fCapacity').value) || 10,
    cell_stock:    parseInt(document.getElementById('fStock').value)    || 0,
    comment:       document.getElementById('fComment').value,
  };

  if (id) {
    const r = await fetch(`/api/products/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!r.ok) { const e = await r.json(); alert(e.error || 'Помилка збереження'); return; }
  } else {
    const r = await fetch('/api/products', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!r.ok) { const e = await r.json(); alert(e.error); return; }
  }

  closeModal();
  await loadProducts();
  await loadAllProducts();
}

async function clearCell() {
  const id = document.getElementById('editId').value;
  if (!id) return;
  if (!confirm('Очистити комірку? Товар буде видалено з системи.')) return;
  await fetch(`/api/products/${id}`, { method: 'DELETE' });
  closeModal();
  await loadProducts();
  await loadAllProducts();
}

async function initProducts() {
  const r = await fetch('/api/products/init_16', { method: 'POST' });
  const d = await r.json();
  alert(`Ініціалізовано ${d.added} товарів`);
  await loadProducts();
  await loadAllProducts();
}

// ─── Каталог товарів ──────────────────────────────────────────────────────────

async function loadAllProducts() {
  const r = await fetch('/api/products/all');
  allProducts = await r.json();
  renderCatalog();
}

function renderCatalog() {
  const search = (document.getElementById('catalogSearch').value || '').toLowerCase();
  const list = document.getElementById('catalogList');
  let filtered = allProducts;
  if (search) {
    filtered = allProducts.filter(p =>
      p.articl.toLowerCase().includes(search) ||
      (p.name || '').toLowerCase().includes(search)
    );
  }
  if (!filtered.length) {
    list.innerHTML = '<div style="color:#6b7280;text-align:center;padding:20px">Товарів не знайдено</div>';
    return;
  }
  list.innerHTML = filtered.map(p => renderCatalogCard(p)).join('');
}

function renderCatalogCard(p) {
  const inCell = p.servo_board === '0x40' && p.servo_channel >= 0 && p.servo_channel <= 15;
  const cellBadge = inCell
    ? `<span class="catalog-cell-badge badge-in-cell">Комірка ${p.servo_channel}</span>`
    : `<span class="catalog-cell-badge badge-no-cell">Без комірки</span>`;
  const dimsText = (p.length && p.width && p.height)
    ? `${(p.length/10).toFixed(1)}×${(p.width/10).toFixed(1)}×${(p.height/10).toFixed(1)} см`
    : '';
  const thumb = p.photo
    ? `<div class="catalog-thumb"><img src="${p.photo}" onerror="this.style.display='none'"></div>`
    : `<div class="catalog-thumb">📦</div>`;

  return `<div class="catalog-card">
    ${thumb}
    <div class="catalog-info">
      <div class="catalog-art">${p.articl} ${cellBadge}</div>
      <div class="catalog-name">${p.name || '—'}</div>
      ${dimsText ? `<div class="catalog-dims">${dimsText}</div>` : ''}
    </div>
    <div class="catalog-actions">
      <button class="btn btn-outline btn-sm"
        onclick="openCatalogModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">✏️</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger)"
        onclick="deleteCatalogProductById(${p.id}, '${p.articl}')">🗑️</button>
    </div>
  </div>`;
}

function openCatalogModal(product) {
  currentCatalogProductId = product ? product.id : null;
  document.getElementById('catalogModalTitle').textContent = product ? `Редагувати: ${product.articl}` : 'Новий товар';
  document.getElementById('cEditId').value = product ? product.id : '';
  document.getElementById('cArticl').value = product ? product.articl : '';
  document.getElementById('cName').value = product ? product.name : '';
  document.getElementById('cLength').value = product ? (product.length / 10).toFixed(1) : 0;
  document.getElementById('cWidth').value  = product ? (product.width  / 10).toFixed(1) : 0;
  document.getElementById('cHeight').value = product ? (product.height / 10).toFixed(1) : 0;
  document.getElementById('cWeight').value = product ? product.weight : 0;
  document.getElementById('cStickerCount').value = product ? product.sticker_count : 0;
  document.getElementById('cStickerNote').value = product ? (product.sticker_note || '') : '';
  document.getElementById('cComment').value = product ? (product.comment || '') : '';

  // Якщо у товару є комірка — показуємо її
  const inCell = product && product.servo_board === '0x40' && product.servo_channel >= 0 && product.servo_channel <= 15;
  document.getElementById('cChannel').value = inCell ? product.servo_channel : '';

  // Фото
  const photo = product && product.photo ? product.photo : null;
  document.getElementById('cPhotoPreview').src = photo || '';
  document.getElementById('cPhotoPreview').style.display = photo ? 'block' : 'none';
  document.getElementById('cPhotoPlaceholder').style.display = photo ? 'none' : 'flex';
  document.getElementById('cPhotoDelBtn').style.display = photo ? 'block' : 'none';
  document.getElementById('cPhotoFile').value = '';

  calcVolume();
  document.getElementById('catalogDeleteBtn').classList.toggle('hidden', !product);
  document.getElementById('catalogModal').classList.remove('hidden');
}

function calcVolume() {
  const l = parseFloat(document.getElementById('cLength').value) || 0;
  const w = parseFloat(document.getElementById('cWidth').value)  || 0;
  const h = parseFloat(document.getElementById('cHeight').value) || 0;
  document.getElementById('cVolume').value = (l > 0 && w > 0 && h > 0) ? (l * w * h).toFixed(1) : '0';
}

function previewCatalogPhoto(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('cPhotoPreview').src = e.target.result;
    document.getElementById('cPhotoPreview').style.display = 'block';
    document.getElementById('cPhotoPlaceholder').style.display = 'none';
    document.getElementById('cPhotoDelBtn').style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

async function deleteCatalogPhoto() {
  if (currentCatalogProductId) {
    await fetch(`/api/products/${currentCatalogProductId}/photo`, { method: 'DELETE' });
    const p = allProducts.find(x => x.id === currentCatalogProductId);
    if (p) p.photo = '';
    renderCatalog();
  }
  document.getElementById('cPhotoFile').value = '';
  document.getElementById('cPhotoPreview').src = '';
  document.getElementById('cPhotoPreview').style.display = 'none';
  document.getElementById('cPhotoPlaceholder').style.display = 'flex';
  document.getElementById('cPhotoDelBtn').style.display = 'none';
}

async function saveCatalogProduct() {
  const id = document.getElementById('cEditId').value;
  const articl = document.getElementById('cArticl').value.trim();
  if (!articl) { alert('Введіть артикул'); return; }

  const channelRaw = document.getElementById('cChannel').value.trim();
  const channel = channelRaw !== '' ? parseInt(channelRaw) : null;

  const baseData = {
    name: document.getElementById('cName').value.trim(),
    length: parseFloat(document.getElementById('cLength').value) * 10 || 0,
    width:  parseFloat(document.getElementById('cWidth').value)  * 10 || 0,
    height: parseFloat(document.getElementById('cHeight').value) * 10 || 0,
    weight: parseFloat(document.getElementById('cWeight').value) || 0,
    sticker_count: parseInt(document.getElementById('cStickerCount').value) || 0,
    sticker_note:  document.getElementById('cStickerNote').value,
    comment:       document.getElementById('cComment').value,
  };

  let savedId = id ? parseInt(id) : null;

  if (id) {
    // Оновлення існуючого товару
    const updateData = { ...baseData, articl };
    if (channel !== null && channel >= 0 && channel <= 15) {
      updateData.servo_board = 0x40;
      updateData.servo_channel = channel;
    } else if (channelRaw === '') {
      updateData.servo_board = 0xFF;
      updateData.servo_channel = -1;
    }
    const r = await fetch(`/api/products/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updateData)
    });
    if (!r.ok) { const e = await r.json(); alert(e.error || 'Помилка збереження'); return; }
  } else {
    // Новий товар
    let r;
    if (channel !== null && channel >= 0 && channel <= 15) {
      r = await fetch('/api/products', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...baseData, articl, servo_board: 0x40, servo_channel: channel, cell_capacity: 10, cell_stock: 0 })
      });
    } else {
      r = await fetch('/api/products/catalog', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...baseData, articl })
      });
    }
    if (!r.ok) { const e = await r.json(); alert(e.error || 'Помилка'); return; }
    const created = await r.json();
    savedId = created.id;
  }

  // Завантажити фото якщо вибрано
  const photoFile = document.getElementById('cPhotoFile').files[0];
  if (photoFile && savedId) {
    const form = new FormData();
    form.append('photo', photoFile);
    await fetch(`/api/products/${savedId}/photo`, { method: 'POST', body: form });
  }

  closeCatalogModal();
  await loadAllProducts();
  await loadProducts();
}

async function deleteCatalogProduct() {
  const id = document.getElementById('cEditId').value;
  if (!id) return;
  const articl = document.getElementById('cArticl').value;
  if (!confirm(`Видалити товар «${articl}»?`)) return;
  await fetch(`/api/products/${id}`, { method: 'DELETE' });
  closeCatalogModal();
  await loadAllProducts();
  await loadProducts();
}

async function deleteCatalogProductById(id, articl) {
  if (!confirm(`Видалити товар «${articl}»?`)) return;
  await fetch(`/api/products/${id}`, { method: 'DELETE' });
  await loadAllProducts();
  await loadProducts();
}

function closeCatalogModal() {
  document.getElementById('catalogModal').classList.add('hidden');
}

// ─── Коробки ──────────────────────────────────────────────────────────────────

async function loadBoxes() {
  const r = await fetch('/api/boxes');
  boxes = await r.json();
  renderBoxes();
}

function renderBoxes() {
  const grid = document.getElementById('boxGrid');
  if (!boxes.length) {
    grid.innerHTML = '<div style="color:#6b7280;padding:20px;text-align:center">Немає коробок. Додайте або ініціалізуйте стандартні.</div>';
    return;
  }
  grid.innerHTML = boxes.map(b => renderBoxCard(b)).join('');
}

function renderBoxCard(b) {
  const lCm = (b.length / 10).toFixed(0);
  const wCm = (b.width  / 10).toFixed(0);
  const hCm = (b.height / 10).toFixed(0);
  const fill = b.max_fill_pct || 80;
  const wt   = b.weight || 0;
  return `<div class="box-card">
    <div class="box-card-header">
      <div class="box-card-name">${b.name}</div>
      <div class="box-card-actions">
        <button class="btn btn-outline btn-sm" onclick="openBoxModal(${JSON.stringify(b).replace(/"/g,'&quot;')})">✏️</button>
        <button class="btn btn-ghost btn-sm" onclick="deleteBox(${b.id}, '${b.name}')"
          style="color:var(--danger)">🗑️</button>
      </div>
    </div>
    <div class="box-dims-grid">
      <div><div class="box-dim-label">Довжина</div><div class="box-dim-val">${lCm} см</div></div>
      <div><div class="box-dim-label">Ширина</div> <div class="box-dim-val">${wCm} см</div></div>
      <div><div class="box-dim-label">Висота</div>  <div class="box-dim-val">${hCm} см</div></div>
      <div><div class="box-dim-label">Макс. заповн.</div><div class="box-dim-val">${fill}%</div></div>
      ${wt ? `<div><div class="box-dim-label">Вага</div><div class="box-dim-val">${wt} г</div></div>` : ''}
    </div>
  </div>`;
}

function openBoxModal(box) {
  document.getElementById('boxModalTitle').textContent = box ? 'Редагувати коробку' : 'Нова коробка';
  document.getElementById('bEditId').value  = box ? box.id : '';
  document.getElementById('bName').value    = box ? box.name : '';
  document.getElementById('bLength').value  = box ? (box.length / 10).toFixed(1) : '';
  document.getElementById('bWidth').value   = box ? (box.width  / 10).toFixed(1) : '';
  document.getElementById('bHeight').value  = box ? (box.height / 10).toFixed(1) : '';
  document.getElementById('bFillPct').value = box ? (box.max_fill_pct || 80) : 80;
  document.getElementById('bWeight').value  = box ? (box.weight || 0) : 0;
  document.getElementById('boxModal').classList.remove('hidden');
}

async function saveBox() {
  const id = document.getElementById('bEditId').value;
  const name = document.getElementById('bName').value.trim();
  if (!name) { alert('Введіть назву'); return; }
  const data = {
    name,
    length:       parseFloat(document.getElementById('bLength').value)  * 10 || 0,
    width:        parseFloat(document.getElementById('bWidth').value)   * 10 || 0,
    height:       parseFloat(document.getElementById('bHeight').value)  * 10 || 0,
    max_fill_pct: parseFloat(document.getElementById('bFillPct').value) || 80,
    weight:       parseFloat(document.getElementById('bWeight').value)  || 0,
  };
  if (id) {
    await fetch(`/api/boxes/${id}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } else {
    await fetch('/api/boxes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  }
  closeModal();
  await loadBoxes();
}

async function deleteBox(id, name) {
  if (!confirm(`Видалити коробку «${name}»?`)) return;
  await fetch(`/api/boxes/${id}`, { method: 'DELETE' });
  await loadBoxes();
}

async function initBoxes() {
  const r = await fetch('/api/boxes/init', { method: 'POST' });
  const d = await r.json();
  alert(`Додано ${d.added} коробок`);
  await loadBoxes();
}

// ─── Утиліти ──────────────────────────────────────────────────────────────────

function showTab(name, event) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  if (event && event.target) event.target.classList.add('active');
}

function closeModal() {
  document.getElementById('productModal').classList.add('hidden');
  document.getElementById('boxModal').classList.add('hidden');
}

init();
</script>
</body>
</html>
